aid: swagger-codegen
name: Swagger Codegen
description: >-
  Swagger Codegen is an open-source template-driven code generation tool that automatically generates client libraries,
  server stubs, and API documentation from OpenAPI Specification definitions. It supports 40+ client languages and 20+
  server frameworks. Available as a CLI, Docker image, Maven/Gradle plugin, and online REST API at
  generator3.swagger.io.
